name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MCP v1 SDK for protocol integration test
        run: python -m pip install 'mcp>=1.18,<2' 'PyJWT[crypto]>=2.9,<3'
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
